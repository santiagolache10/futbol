<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fútbol · Relaciones JPA</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
        .club { border: 1px solid #ccc; border-radius: 10px; padding: 1rem; margin-bottom: 1rem; }
        h1 { margin-bottom: .2rem; }
        small { color: #666; }
    </style>
</head>
<body>
    <h1>Clubes de fútbol</h1>
    <small>Relaciones: OneToOne · OneToMany · ManyToOne · ManyToMany</small>
    <div id="lista"></div>

    <script>
        fetch('/api/clubes')
            .then(r => r.json())
            .then(clubes => {
                document.getElementById('lista').innerHTML = clubes.map(c => `
                    <div class="club">
                        <h2>${c.nombre}</h2>
                        <p><b>Entrenador:</b> ${c.entrenador ? c.entrenador.nombre + ' ' + c.entrenador.apellido : '—'}</p>
                        <p><b>Asociación:</b> ${c.asociacion ? c.asociacion.nombre : '—'}</p>
                        <p><b>Jugadores:</b> ${c.jugadores.map(j => j.nombre + ' (' + j.posicion + ')').join(', ') || '—'}</p>
                        <p><b>Competiciones:</b> ${c.competiciones.map(x => x.nombre).join(', ') || '—'}</p>
                    </div>`).join('');
            });
    </script>
</body>
</html>
